name: Refresh outdoor catalog

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-outdoor-catalog-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build SQLite catalog
        run: python3 Tools/build_outdoor_catalog.py

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- Drash/Resources/outdoor-places.sqlite; then
            echo "Outdoor catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Drash/Resources/outdoor-places.sqlite
          git commit -m "chore: refresh outdoor catalog"
          git push origin HEAD:main
